services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: ${MLFLOW_DB_NAME}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER} -d ${MLFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build: .
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --allowed-hosts
      - "mlflow:5000,localhost:5000,127.0.0.1:5000"
      - --backend-store-uri
      - postgresql+psycopg2://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@db:5432/${MLFLOW_DB_NAME}
      - --serve-artifacts
      - --artifacts-destination
      - /mlartifacts
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlartifacts
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  model-init:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    command: ["python", "-m", "src.tracking.register_model"]
    restart: "no"

  api:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      model-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

volumes:
  mlflow_db_data:
  mlflow_artifacts: