name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Format check
        run: |
          black --check app src tests

      - name: Lint
        run: |
          ruff check app src tests

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Create models directory for Docker build
        run: |
          mkdir -p models

      - name: Build Docker image
        run: |
          docker build -t olist-mlops-api .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag olist-mlops-api ghcr.io/${{ github.repository_owner }}/olist-mlops-api:latest

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/olist-mlops-api:latest